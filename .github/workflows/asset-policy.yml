name: Public asset policy checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-public-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate public asset manifest and placement
        run: python3 tools/validate_public_assets.py
      - name: Verify Python tool syntax
        run: python3 -m py_compile tools/validate_public_assets.py
