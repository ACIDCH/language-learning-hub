name: Editorial V0.9 C1 and IELTS U05
on:
  pull_request:
    paths:
      - 'docs/editorial/v09/**'
      - '.github/workflows/editorial-v09.yml'
  push:
    branches: [main]
    paths:
      - 'docs/editorial/v09/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate course IDs and source privacy
        run: node docs/editorial/v09/validate.mjs
