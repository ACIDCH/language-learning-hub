name: French A1 editorial source and audio verification gates
on:
  pull_request:
    paths:
      - 'docs/editorial/a1-qa-v13/**'
      - '.github/workflows/editorial-a1-v13.yml'
  push:
    branches: [main]
    paths:
      - 'docs/editorial/a1-qa-v13/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/editorial/a1-qa-v13/validate.mjs
      - run: node docs/editorial/a1-qa-v13/validate-audio-segments.mjs
