name: Course manuscript coverage audit
on:
  pull_request:
    paths:
      - 'docs/editorial/coverage/**'
      - '.github/workflows/editorial-coverage.yml'
      - 'docs/editorial/v*/manifest.json'
  push:
    branches: [main]
    paths:
      - 'docs/editorial/coverage/**'
      - '.github/workflows/editorial-coverage.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/editorial/coverage/validate.mjs
