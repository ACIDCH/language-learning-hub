name: Cloudflare Pages prototype preview (optional)

on:
  pull_request:
    paths:
      - 'design-prototypes/academic-clean/**'
      - 'tools/build_pages_preview.mjs'
      - '.github/workflows/cloudflare-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate UI prototype
        run: |
          node --check design-prototypes/academic-clean/app.js
          node design-prototypes/academic-clean/check-prototype.mjs
      - name: Prepare public-only preview bundle
        run: node tools/build_pages_preview.mjs
      - name: Confirm preview package contains only allowlisted files
        run: |
          test "$(find dist-preview -type f | wc -l)" -eq 4
          test -f dist-preview/_headers
      - uses: actions/upload-artifact@v4
        with:
          name: language-hub-static-preview
          path: dist-preview
          retention-days: 3

  deploy-preview:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node tools/build_pages_preview.mjs
      - name: Upload to manually provisioned Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-preview --project-name=language-learning-hub-preview --branch=review
