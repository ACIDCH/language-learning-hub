name: React frontend build and safety gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-fund
      - name: Verify public-only cloud connection contract
        run: node --test tests/cloud-config.test.mjs
      - name: Test six-stage manuscript renderer parser
        run: node --experimental-strip-types --test tests/lessonStages.test.mjs
      - name: Validate 24-track private ZIP import contract
        run: node --experimental-strip-types --test tests/audioZip.test.mjs
      - name: Validate speech transcript feedback and multilingual normalization
        run: node --experimental-strip-types --test tests/speechCompare.test.mjs
      - name: Verify learning overview and saved course state handling
        run: node --experimental-strip-types --test tests/learningProgress.test.mjs
      - name: Verify already-synced private inventory helpers
        run: node --experimental-strip-types --test tests/resourceInventory.test.mjs
      - name: Validate learning route ordering and real completion states
        run: node --experimental-strip-types --test tests/learningRoadmap.test.mjs
      - name: Check 353 recorded audio references and licensing display contract
        run: node --experimental-strip-types --test tests/referenceCatalog.test.mjs
      - name: Verify multilingual QA markers and independent human approval
        run: node --test tests/qaMarkers.test.mjs
      - name: Validate original 24-unit beginner course quality contract
        run: node --experimental-strip-types --test tests/foundationCurriculum.test.mjs
      - name: Verify full 108-course learning guidance and prerequisites
        run: node --experimental-strip-types --test tests/courseGuide.test.mjs
      - name: Audit real section headings and manual QA separation
        run: node --experimental-strip-types --test tests/stageAudit.test.mjs
      - name: Test all foundation active-recall cards
        run: node --experimental-strip-types --test tests/foundationRecall.test.mjs
      - name: Validate 96 meaning checks against original teaching vocabulary
        run: node --experimental-strip-types --test tests/foundationQuiz.test.mjs
      - name: Check all 24 course listening dictation text contracts
        run: node --experimental-strip-types --test tests/foundationDictation.test.mjs
      - name: Check saved-answer review scheduling and progress safety
        run: node --experimental-strip-types --test tests/foundationReview.test.mjs
      - name: Verify every English and French alphabet reference card
        run: node --experimental-strip-types --test tests/foundationAlphabet.test.mjs
      - name: Check TypeScript and build
        run: npm run build
      - name: Confirm Cloudflare root-path static bundle and verified public lessons
        run: |
          test -f dist/index.html
          test -f dist/learning-assets/manifest.json
          test -f dist/learning-assets/fr-a1-u01.txt
          test -f dist/learning-assets/en-ielts-reading-u01.txt
          grep -q '/assets/' dist/index.html
          if grep -R -E 'sb_secret_|service_role|BEGIN PRIVATE KEY' dist; then
            echo 'Private credential markers detected in public build' >&2
            exit 1
          fi
