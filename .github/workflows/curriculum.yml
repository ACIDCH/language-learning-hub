name: Curriculum framework integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate English/French curriculum IDs, source links, coverage
        run: python3 tools/validate_curriculum.py
      - name: Python syntax validation
        run: python3 -m py_compile tools/validate_curriculum.py
      - name: Generate lesson-by-lesson pedagogical review inventory
        run: node scripts/audit_teaching_depth.mjs
      - name: Preserve pedagogical review inventory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-depth-inventory
          path: reports/curriculum-depth/
          if-no-files-found: ignore
          retention-days: 21
